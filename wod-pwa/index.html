<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>WOD Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WOD Timer">
<meta name="theme-color" content="#f5f7fc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #cfe3ff; }
  @property --c2 { syntax: '<color>'; inherits: true; initial-value: #f5f7fc; }

  :root {
    --c1: #cfe3ff; --c2: #f5f7fc; --accent: #0a84ff; --ok: #1fb455;
    --glass: rgba(255,255,255,.75); --stroke: rgba(0,0,0,.07);
    --muted: rgba(28,28,30,.55);
  }
  body.countdown { --c1: #ffd9a3; --c2: #fff1dc; --accent: #ff9500; }
  body.work      { --c1: #b4f2c8; --c2: #e6fbee; --accent: #1fb455; }
  body.rest      { --c1: #ffc2bd; --c2: #ffeceb; --accent: #ff453a; }
  body.finished  { --c1: #bddaff; --c2: #e8f2ff; --accent: #0a84ff; }
  body.paused    { --c1: #e4e4ee; --c2: #f6f6fa; --accent: #ff9500; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; color: #1c1c1e; overscroll-behavior: none;
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  body {
    background:
      radial-gradient(120% 70% at 50% -10%, var(--c1) 0%, transparent 60%),
      linear-gradient(180deg, var(--c2), #f7f8fc 85%);
    background-attachment: fixed;
    transition: --c1 .6s ease, --c2 .6s ease;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .screen { display: none; min-height: 100dvh; flex-direction: column; padding: 14px 0 16px; }
  .screen.on { display: flex; animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .spacer { flex: 1; }

  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 10;
    transform: translate(-50%, -24px); opacity: 0; pointer-events: none; transition: all .3s;
    background: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Setup ---------- */
  .brand { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
  .brand i { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #30d158, #0a84ff);
    display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 13px; color: #fff; }
  .brand b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }

  .tabs { display: flex; gap: 22px; margin: 0 4px 16px; border-bottom: 1px solid rgba(0,0,0,.08); }
  .tabs button { border: 0; background: none; padding: 8px 0 10px; font-size: 16px; font-weight: 700;
    color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button.sel { color: #1c1c1e; border-color: var(--ok); }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
    background: rgba(0,0,0,.06); border-radius: 16px; }
  .seg.c5 { grid-template-columns: repeat(5, 1fr); }
  .seg.c3 { grid-template-columns: repeat(3, 1fr); }
  .seg button { border: 0; background: none; padding: 11px 0; font-size: 13px; font-weight: 600;
    color: var(--muted); border-radius: 12px; transition: all .2s; white-space: nowrap; }
  .seg button.sel { background: #fff; color: #1c1c1e; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .seg.mini { min-width: 190px; }
  .seg.mini button { padding: 8px 0; }

  .hint { color: var(--muted); font-size: 14px; line-height: 1.4; margin: 14px 4px 16px; min-height: 40px; }
  .hint b { color: #1c1c1e; }

  .card { background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px; padding: 4px 18px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0;
    border-bottom: 1px solid rgba(0,0,0,.06); }
  .row:last-child { border: 0; }
  .row label { font-size: 16px; font-weight: 500; }
  .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-weight: 400; }
  .step { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,.05); border-radius: 14px; padding: 4px; }
  .step button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 22px; line-height: 1; transition: transform .1s; }
  .step button:active { transform: scale(.88); }
  .step span { min-width: 50px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  .sw { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 0; background: rgba(0,0,0,.16);
    position: relative; transition: background .2s; }
  .sw i { position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .2s; }
  .sw.on { background: var(--ok); }
  .sw.on i { transform: translateX(20px); }

  .ghostbtn { width: 100%; margin: 14px 0; padding: 15px 0; border-radius: 18px; border: 1px solid var(--stroke);
    background: var(--glass); font-size: 15px; font-weight: 700; }
  .ghostbtn:active { transform: scale(.98); }
  .sets { margin-bottom: 8px; }
  .title { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin: 6px 4px 8px; }

  .empty { text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; padding: 40px 20px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 10px;
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 18px; }
  .item.tap:active { transform: scale(.98); }
  .item .info { flex: 1; min-width: 0; }
  .item b { font-size: 16px; }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .item .res { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .item .x { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.06);
    font-size: 18px; color: var(--muted); }
  .best { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: #ffe58a;
    font-size: 10px; font-weight: 800; letter-spacing: .08em; vertical-align: middle; }

  .gowrap { position: sticky; bottom: 0; margin-top: auto; padding: 18px 0 4px;
    background: linear-gradient(180deg, transparent, #f7f8fc 38%); }
  .go { width: 100%; padding: 20px 0; border: 0; border-radius: 22px; font-size: 20px; font-weight: 800;
    letter-spacing: .08em; color: #fff; background: linear-gradient(135deg, #3ddc72, #1fb455);
    box-shadow: 0 10px 28px rgba(31,180,85,.35), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .12s; }
  .go:active { transform: scale(.97); }

  /* ---------- Reloj ---------- */
  .chip { align-self: center; margin-top: 8px; padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    letter-spacing: .12em; background: var(--glass); border: 1px solid var(--stroke); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warn { display: none; align-self: center; margin-top: 8px; padding: 8px 14px; border-radius: 12px;
    background: #fff3cd; font-size: 13px; font-weight: 600; text-align: center; }

  .dial { position: relative; width: min(86vw, 46vh, 380px); aspect-ratio: 1; align-self: center; margin: 14px 0; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .dial circle { fill: none; stroke-width: 5; stroke-linecap: round; }
  .dial .track { stroke: rgba(0,0,0,.07); }
  .dial .fill { stroke: var(--accent); stroke-dasharray: 289.03; stroke-dashoffset: 289.03;
    filter: drop-shadow(0 2px 6px var(--accent)); transition: stroke-dashoffset .12s linear; }
  .dial .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #time { font-size: min(21vw, 13vh, 104px); font-weight: 800; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums; line-height: 1; }
  #sub { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .06em; min-height: 20px; }
  .pulse #time { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.03); } }

  .lbar { display: none; height: 12px; border-radius: 6px; background: rgba(0,0,0,.08); overflow: hidden; margin: 0 4px 10px; }
  .lbar div { height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .12s linear; }

  /* pantalla gigante */
  #run.big .dial { width: 100%; aspect-ratio: auto; margin: 6px 0; }
  #run.big .dial svg { display: none; }
  #run.big .dial .center { position: static; }
  #run.big #time { font-size: min(33vw, 34vh); }
  #run.big #sub { font-size: 20px; }
  #run.big .lbar { display: block; }
  @media (orientation: landscape) { #run.big #time { font-size: min(30vw, 52vh); } }

  #rounds { display: none; flex-direction: column; margin: 0 auto 8px; width: min(100%, 360px);
    padding: 8px 12px 8px 20px; background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  #rounds .cnt { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  #rounds .cnt + .cnt { border-top: 1px solid rgba(0,0,0,.06); }
  #rounds .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
  #rounds .n { font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #rounds .b { display: flex; gap: 8px; }
  #rounds button { width: 54px; height: 54px; border-radius: 17px; border: 0; background: rgba(0,0,0,.06);
    font-size: 28px; transition: transform .1s; }
  #rounds button:active { transform: scale(.9); }
  #rounds .main #rp { background: var(--accent); color: #fff; width: 80px; }
  #rounds .small .n { font-size: 26px; }
  #rounds .small button { width: 44px; height: 44px; font-size: 24px; border-radius: 14px; }
  #rounds .small #xp { width: 60px; background: rgba(0,0,0,.12); }

  .laps { display: none; margin: 8px auto; width: min(100%, 360px); max-height: 17vh; overflow: auto; padding: 4px 16px; }
  .lap { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0;
    font-variant-numeric: tabular-nums; border-bottom: 1px solid rgba(0,0,0,.05); }
  .lap:last-child { border: 0; }
  .lap span { color: var(--muted); font-size: 13px; font-weight: 600; }
  .lap b { font-size: 18px; }
  .lap em { font-style: normal; color: var(--muted); font-size: 13px; min-width: 70px; text-align: right; }

  .btns { display: flex; gap: 10px; }
  .big { flex: 1; padding: 19px 0; border: 0; border-radius: 20px; font-size: 15px; font-weight: 800; letter-spacing: .06em;
    color: #1c1c1e; background: #fff; transition: transform .12s; box-shadow: 0 6px 20px rgba(0,0,0,.12); white-space: nowrap; }
  .big:active { transform: scale(.96); }
  .big.y { background: #ffd60a; } .big.g { background: #30d158; } .big.r { background: #ff453a; color: #fff; }
  .big.ghost { background: var(--glass); border: 1px solid var(--stroke); box-shadow: none; }
  .big:disabled { opacity: .6; }
</style>
</head>
<body>

<div id="toast"></div>

<div class="screen on" id="setup">
  <div class="brand"><i>WOD</i><b>Timer</b></div>
  <div class="tabs" id="tabs">
    <button data-t="timer">Timer</button>
    <button data-t="wods">Guardados</button>
    <button data-t="hist">Historial</button>
  </div>
  <div id="pane"></div>
  <div class="gowrap" id="gowrap"><button class="go" id="start">START</button></div>
</div>

<div class="screen" id="run">
  <div class="chip" id="head"></div>
  <div class="warn" id="warn">Mantené la pantalla encendida: el celular no permite bloquearla</div>
  <div class="spacer"></div>
  <div class="dial" id="dial">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="46"/>
      <circle class="fill" id="bar" cx="50" cy="50" r="46"/>
    </svg>
    <div class="center"><div id="time">00:00</div><div id="sub"></div></div>
  </div>
  <div class="lbar"><div id="lbarf"></div></div>
  <div id="rounds">
    <div class="cnt main"><div><div class="lbl">RONDAS</div><div class="n" id="rc">0</div></div>
      <div class="b"><button id="rm">−</button><button id="rp">+</button></div></div>
    <div class="cnt small"><div><div class="lbl">REPS EXTRA</div><div class="n" id="xc">0</div></div>
      <div class="b"><button id="xm">−</button><button id="xp">+</button></div></div>
  </div>
  <div class="card laps" id="laps"></div>
  <div class="spacer"></div>
  <div class="btns" id="ctl"></div>
</div>

<script>
const MODES = {
  fortime: { name: 'For Time', hint: 'Cronómetro hacia arriba. Marcá vueltas y terminá cuando completes el WOD.' },
  amrap:   { name: 'AMRAP',    hint: 'Cuenta regresiva. Contá rondas y repeticiones extra.' },
  emom:    { name: 'EMOM',     hint: 'Cada intervalo arranca una nueva ronda.' },
  tabata:  { name: 'Tabata',   hint: 'Intervalos cortos de trabajo y descanso.' },
  series:  { name: 'Series',   hint: 'Trabajo y descanso por ronda. Ej: 5 series de 3 min con 1 min de pausa.' },
};
const FIELDS = {
  fortime: [['minutes', 'Time cap', 0, 120, 1, 'minutos · 0 = sin cap']],
  amrap:   [['minutes', 'Duración', 1, 120, 1, 'minutos']],
  emom:    [['interval', 'Intervalo', 10, 600, 5, 'segundos'], ['rounds', 'Rondas', 1, 100, 1, '']],
  tabata:  [['work', 'Trabajo', 5, 300, 5, 'segundos'], ['rest', 'Descanso', 0, 300, 5, 'segundos'], ['rounds', 'Rondas', 1, 50, 1, '']],
  series:  [['sWork', 'Trabajo', 5, 1800, 15, 'min:seg'], ['sRest', 'Descanso', 0, 900, 15, 'min:seg'], ['sRounds', 'Rondas', 1, 50, 1, '']],
};
const PRE = ['pre', 'Cuenta previa', 0, 30, 1, 'segundos'];
const TONES = { beep: ['Beep', 'square', .22], suave: ['Suave', 'sine', .45], alarma: ['Alarma', 'sawtooth', .2] };

// ---------- Utilidades / almacenamiento ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

const cfg = Object.assign({ mode: 'amrap', minutes: 10, interval: 60, rounds: 10, work: 20, rest: 10,
  sWork: 180, sRest: 60, sRounds: 5, pre: 10 }, get('wodcfg', {}));
const set = Object.assign({ sound: true, tone: 'beep', alerts: true, big: false }, get('wodset', {}));
let wods = get('wodsaved', []);
let hist = get('wodhist', []);

let tab = 'timer', curName = '';
let state = 'idle', elapsed = 0, pre = 0, roundCount = 0, reps = 0, laps = [];
let tm = null, last = 0, lastPhase = -1, lastSec = -1;
let half = false, minWarn = false, finalManual = false, resSaved = false;
let wake = null, lockOk = null;

const describe = c => {
  switch (c.mode) {
    case 'fortime': return 'For Time' + (c.minutes ? ' · cap ' + c.minutes + ' min' : '');
    case 'amrap': return 'AMRAP ' + c.minutes + ' min';
    case 'emom': return 'EMOM ' + c.rounds + ' × ' + c.interval + 's';
    case 'tabata': return 'Tabata ' + c.rounds + ' × ' + c.work + '/' + c.rest + 's';
    case 'series': return 'Series ' + c.sRounds + ' × ' + fmt(c.sWork) + ' / ' + fmt(c.sRest);
  }
};
const fieldVal = k => (k === 'sWork' || k === 'sRest') ? fmt(cfg[k]) : cfg[k];

let tt;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2800);
}

// ---------- Setup (pestañas) ----------
function paneTimer() {
  const modes = Object.entries(MODES).map(([k, m]) =>
    `<button data-m="${k}" class="${k === cfg.mode ? 'sel' : ''}">${m.name}</button>`).join('');
  const rows = [...FIELDS[cfg.mode], PRE].map(([k, label, , , , note]) =>
    `<div class="row"><label>${label}${note ? `<small>${note}</small>` : ''}</label><div class="step">
      <button data-k="${k}" data-d="-1">−</button><span>${fieldVal(k)}</span><button data-k="${k}" data-d="1">+</button></div></div>`).join('');
  const sw = (key, on) => `<button class="sw ${on ? 'on' : ''}" data-s="${key}" aria-label="${key}"><i></i></button>`;
  const tones = Object.entries(TONES).map(([k, t]) =>
    `<button data-tone="${k}" class="${k === set.tone ? 'sel' : ''}">${t[0]}</button>`).join('');
  return `<div class="seg c5">${modes}</div>
    <div class="hint">${curName ? `<b>${esc(curName)}</b> · ` : ''}${MODES[cfg.mode].hint}</div>
    <div class="card">${rows}</div>
    <button class="ghostbtn" data-act="savewod">Guardar este WOD</button>
    <div class="title">AJUSTES</div>
    <div class="card sets">
      <div class="row"><label>Sonido</label>${sw('sound', set.sound)}</div>
      <div class="row"><label>Tono</label><div class="seg c3 mini">${tones}</div></div>
      <div class="row"><label>Avisos<small>Mitad y último minuto</small></label>${sw('alerts', set.alerts)}</div>
      <div class="row"><label>Pantalla gigante<small>Números enormes. También tocando el reloj</small></label>${sw('big', set.big)}</div>
    </div>`;
}
function paneWods() {
  if (!wods.length) return `<div class="empty">Todavía no guardaste ningún WOD.<br>Armalo en la pestaña Timer y tocá "Guardar este WOD".</div>`;
  return wods.map(w => `<div class="item tap" data-load="${w.id}"><div class="info"><b>${esc(w.name)}</b>
    <small>${describe(w.cfg)}</small></div><button class="x" data-delw="${w.id}">×</button></div>`).join('');
}
function paneHist() {
  if (!hist.length) return `<div class="empty">Todavía no hay resultados.<br>Al terminar un WOD tocá GUARDAR para anotarlo.</div>`;
  return hist.map(h => {
    const b = bestEntry(h.name, h.mode);
    const date = new Date(h.ts).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
    const nl = h.laps && h.laps.length ? ` · ${h.laps.length} vueltas` : '';
    return `<div class="item"><div class="info"><b>${esc(h.name)}</b>${b && b.id === h.id ? '<span class="best">MEJOR</span>' : ''}
      <small>${date} · ${esc(h.desc)}${nl}</small></div><div class="res">${esc(h.result)}</div>
      <button class="x" data-delh="${h.id}">×</button></div>`;
  }).join('');
}
function renderSetup() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('sel', b.dataset.t === tab));
  $('gowrap').style.display = tab === 'timer' ? 'block' : 'none';
  $('pane').innerHTML = tab === 'timer' ? paneTimer() : tab === 'wods' ? paneWods() : paneHist();
}

function bestEntry(name, mode) {
  let b = null;
  for (const h of hist) {
    if (h.name !== name || h.mode !== mode || h.score == null) continue;
    if (!b || (h.dir === 'low' ? h.score < b.score : h.score > b.score)) b = h;
  }
  return b;
}

function saveWod() {
  const name = prompt('Nombre para este WOD', curName || '');
  if (name === null || !name.trim()) return;
  const nm = name.trim();
  const w = { id: Date.now(), name: nm, cfg: Object.assign({}, cfg) };
  const i = wods.findIndex(x => x.name.toLowerCase() === nm.toLowerCase());
  if (i >= 0) wods[i] = w; else wods.unshift(w);
  put('wodsaved', wods); curName = nm; toast('WOD guardado'); renderSetup();
}

$('setup').onclick = e => {
  const el = e.target.closest('[data-m],[data-k],[data-s],[data-tone],[data-t],[data-act],[data-load],[data-delw],[data-delh]');
  if (!el) return;
  const d = el.dataset;
  if (d.t) { tab = d.t; renderSetup(); }
  else if (d.m) { cfg.mode = d.m; curName = ''; put('wodcfg', cfg); renderSetup(); }
  else if (d.k) {
    const def = [...FIELDS[cfg.mode], PRE].find(f => f[0] === d.k);
    cfg[d.k] = Math.min(def[3], Math.max(def[2], cfg[d.k] + def[4] * Number(d.d)));
    if (d.k !== 'pre') curName = '';
    put('wodcfg', cfg); renderSetup();
  }
  else if (d.s) { set[d.s] = !set[d.s]; put('wodset', set); renderSetup(); if (d.s === 'sound' && set.sound) beepShort(); }
  else if (d.tone) { set.tone = d.tone; put('wodset', set); renderSetup(); beepShort(); }
  else if (d.act === 'savewod') saveWod();
  else if (d.load) {
    const w = wods.find(x => String(x.id) === d.load); if (!w) return;
    Object.assign(cfg, w.cfg); curName = w.name; put('wodcfg', cfg); tab = 'timer'; renderSetup(); toast('Cargado: ' + w.name);
  }
  else if (d.delw) { if (confirm('¿Borrar este WOD guardado?')) { wods = wods.filter(x => String(x.id) !== d.delw); put('wodsaved', wods); renderSetup(); } }
  else if (d.delh) { if (confirm('¿Borrar este resultado?')) { hist = hist.filter(x => String(x.id) !== d.delh); put('wodhist', hist); renderSetup(); } }
};

// ---------- Derivados ----------
const isIv = () => cfg.mode === 'tabata' || cfg.mode === 'series';
const W = () => cfg.mode === 'series' ? cfg.sWork : cfg.work;
const R = () => cfg.mode === 'series' ? cfg.sRest : cfg.rest;
const N = () => cfg.mode === 'series' ? cfg.sRounds : cfg.rounds;

function total() {
  switch (cfg.mode) {
    case 'fortime': return cfg.minutes > 0 ? cfg.minutes * 60 : null;
    case 'amrap': return cfg.minutes * 60;
    case 'emom': return cfg.interval * cfg.rounds;
    default: return (W() + R()) * N();
  }
}
const cycle = () => cfg.mode === 'emom' ? cfg.interval : W() + R();
const round = () => Math.min(Math.floor(elapsed / cycle()) + 1, N());
const phase = () => !isIv() ? 'work' : (elapsed % cycle() < W() ? 'work' : 'rest');
function display() {
  if (state === 'countdown') return Math.max(pre, 0);
  if (state === 'finished' && cfg.mode !== 'fortime') return 0;
  switch (cfg.mode) {
    case 'fortime': return elapsed;
    case 'amrap': return Math.max(total() - elapsed, 0);
    case 'emom': return cfg.interval - (elapsed % cfg.interval);
    default: { const c = elapsed % cycle(); return c < W() ? W() - c : cycle() - c; }
  }
}
function getResult() {
  if (cfg.mode === 'fortime') {
    return finalManual ? { text: fmt(elapsed), score: Math.floor(elapsed), dir: 'low' }
                       : { text: 'Time cap ' + fmt(total()), score: null, dir: null };
  }
  if (cfg.mode === 'amrap') {
    return { text: roundCount + ' rondas' + (reps ? ' + ' + reps + ' reps' : ''), score: roundCount * 10000 + reps, dir: 'high' };
  }
  return { text: 'Completado', score: null, dir: null };
}

// ---------- Sonido ----------
let ac;
function ensureAC() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(freq, dur) {
  if (!set.sound) return;
  try {
    ensureAC();
    const t = TONES[set.tone] || TONES.beep;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.type = t[1];
    g.gain.setValueAtTime(t[2], ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(dur * 500);
}
const beepShort = () => tone(880, .12);
const beepLong = () => tone(1320, .6);
function notice(msg, n) {
  toast(msg);
  for (let i = 0; i < n; i++) setTimeout(() => tone(1100, .15), i * 230);
}

// ---------- Control ----------
async function lock(on) {
  try {
    if (!on) { lockOk = null; if (wake) { wake.release(); wake = null; } return; }
    if (!('wakeLock' in navigator)) { lockOk = false; return; }
    lockOk = null;
    wake = await navigator.wakeLock.request('screen');
    lockOk = true;
    wake.addEventListener('release', () => { if (state === 'running') lockOk = false; });
  } catch (e) { lockOk = false; }
}
// Si el celular se bloquea, el reloj se recupera con la hora real al volver
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (state === 'running' || state === 'countdown')) { lock(true); tick(); }
});

function begin() {
  elapsed = 0; roundCount = 0; reps = 0; laps = []; resSaved = false; finalManual = false;
  half = false; minWarn = false; lastPhase = -1; lastSec = -1;
  ensureAC(); lock(true);
  if (cfg.pre > 0) { pre = cfg.pre; state = 'countdown'; } else { state = 'running'; beepLong(); }
  ticking(); show();
}
function ticking() { clearInterval(tm); last = Date.now(); tm = setInterval(tick, 50); }
function tick() {
  const now = Date.now(), dt = Math.max(0, (now - last) / 1000); last = now;
  if (dt > 2 && (state === 'running' || state === 'countdown')) toast('Tiempo recuperado');

  if (state === 'countdown') {
    pre -= dt;
    const s = Math.ceil(pre);
    if (s !== lastSec) { lastSec = s; if (s > 0 && s <= 3) beepShort(); }
    if (pre <= 0) { elapsed = -pre; state = 'running'; lastSec = -1; beepLong(); show(); return; }
  } else if (state === 'running') {
    elapsed += dt;
    const t = total();
    if (t !== null && elapsed >= t) { elapsed = t; return finish(false); }

    if (set.alerts && t) {
      if (!half && t >= 60 && elapsed >= t / 2) { half = true; notice('Mitad del tiempo', 2); }
      if (!minWarn && t >= 180 && t - elapsed <= 60) { minWarn = true; notice('Último minuto', 3); }
    }
    if (cfg.mode !== 'fortime') {
      const id = cfg.mode === 'emom' ? round() : round() * 2 + (phase() === 'work' ? 0 : 1);
      if (lastPhase !== -1 && id !== lastPhase) beepLong();
      lastPhase = id;
      const s = Math.ceil(display());
      if (s !== lastSec) { lastSec = s; if (s >= 1 && s <= 3) beepShort(); }
    }
  }
  paint();
}
function pause() { clearInterval(tm); if (state === 'countdown') { state = 'idle'; lock(false); } else state = 'paused'; show(); if (state === 'idle') renderSetup(); }
function resume() { state = 'running'; lock(true); ticking(); show(); }
function finish(manual) { clearInterval(tm); state = 'finished'; finalManual = !!manual; lock(false); beepLong(); show(); }
function reset() { clearInterval(tm); state = 'idle'; elapsed = 0; lock(false); show(); renderSetup(); }
function lap() {
  if (state !== 'running') return;
  laps.push(Math.floor(elapsed)); beepShort(); renderLaps();
}
function saveResult() {
  if (resSaved || state !== 'finished') return;
  const name = prompt('Nombre del WOD', curName || MODES[cfg.mode].name);
  if (name === null) return;
  const nm = name.trim() || MODES[cfg.mode].name;
  const r = getResult();
  const prev = r.score != null ? bestEntry(nm, cfg.mode) : null;
  hist.unshift({ id: Date.now(), ts: Date.now(), name: nm, mode: cfg.mode, desc: describe(cfg),
    result: r.text, score: r.score, dir: r.dir, laps: laps.slice() });
  hist = hist.slice(0, 300); put('wodhist', hist);
  curName = nm; resSaved = true;
  let msg = 'Resultado guardado';
  if (r.score != null) {
    if (!prev) msg = 'Primer registro de ' + nm;
    else if (r.dir === 'low' ? r.score < prev.score : r.score > prev.score) msg = '¡Nuevo récord!';
    else msg = 'Tu mejor: ' + prev.result;
  }
  toast(msg); show();
}

// ---------- Pantalla ----------
const btn = (label, cls, fn) => `<button class="big ${cls}" data-a="${fn}">${label}</button>`;
function renderLaps() {
  const el = $('laps');
  const on = cfg.mode === 'fortime' && laps.length > 0 && state !== 'idle';
  el.style.display = on ? 'block' : 'none';
  if (!on) return;
  el.innerHTML = laps.map((t, i) =>
    `<div class="lap"><span>Vuelta ${i + 1}</span><b>${fmt(t)}</b><em>+${fmt(t - (laps[i - 1] || 0))}</em></div>`).reverse().join('');
}
function show() {
  $('setup').classList.toggle('on', state === 'idle');
  $('run').classList.toggle('on', state !== 'idle');
  $('ctl').innerHTML =
    state === 'countdown' ? btn('PAUSA', 'y', 'pause') :
    state === 'running' ? btn('PAUSA', 'y', 'pause') + (cfg.mode === 'fortime' ? btn('VUELTA', 'ghost', 'lap') + btn('TERMINAR', '', 'finish') : '') :
    state === 'paused' ? btn('SEGUIR', 'g', 'resume') + btn('RESET', 'r', 'reset') :
    state === 'finished' ? (resSaved ? '<button class="big ghost" disabled>✓ GUARDADO</button>' : btn('GUARDAR', 'g', 'save')) + btn('NUEVO WOD', '', 'reset') : '';
  $('rounds').style.display = cfg.mode === 'amrap' && state !== 'countdown' ? 'flex' : 'none';
  renderLaps();
  paint();
}
const C = 2 * Math.PI * 46;
function paint() {
  if (state === 'idle') { document.body.className = ''; return; }
  const up = cfg.mode === 'fortime' && state !== 'countdown';
  const v = up ? Math.floor(display()) : Math.ceil(display());
  $('time').textContent = fmt(v);
  $('rc').textContent = roundCount;
  $('xc').textContent = reps;
  $('run').classList.toggle('big', !!set.big);
  $('warn').style.display = (state === 'running' || state === 'countdown') && lockOk === false ? 'block' : 'none';

  // anillo: avance del WOD; en For Time sin cap marca cada minuto
  const t = total();
  let p;
  if (state === 'countdown') p = 1 - Math.max(pre, 0) / Math.max(cfg.pre, 1);
  else if (t) p = Math.min(elapsed / t, 1);
  else p = (elapsed % 60) / 60;
  $('bar').style.strokeDashoffset = C * (1 - p);
  $('lbarf').style.width = p * 100 + '%';

  const label = curName ? curName.toUpperCase() : MODES[cfg.mode].name.toUpperCase();
  let head, sub = '';
  if (state === 'countdown') head = 'PREPARATE';
  else if (state === 'finished') {
    head = '¡TERMINADO!';
    sub = cfg.mode === 'fortime' ? (finalManual ? 'TIEMPO FINAL' : 'TIME CAP')
        : cfg.mode === 'amrap' ? getResult().text.toUpperCase() : '';
  }
  else if (state === 'paused') head = 'PAUSA';
  else if (cfg.mode === 'emom') { head = curName ? label : 'EMOM'; sub = `RONDA ${round()} / ${N()}`; }
  else if (isIv()) { head = phase() === 'work' ? 'TRABAJO' : 'DESCANSO'; sub = `RONDA ${round()} / ${N()}`; }
  else head = label;
  $('head').textContent = head;
  $('sub').textContent = sub;

  document.body.className = state === 'countdown' ? 'countdown' : state === 'finished' ? 'finished' :
    state === 'paused' ? 'paused' : phase();
  $('run').classList.toggle('pulse', state === 'countdown');
}

$('start').onclick = begin;
$('ctl').onclick = e => {
  const a = e.target.dataset.a;
  if (a) ({ pause, resume, finish: () => finish(true), reset, lap, save: saveResult })[a]();
};
$('dial').onclick = () => { set.big = !set.big; put('wodset', set); paint(); };
$('rp').onclick = () => { roundCount++; if (navigator.vibrate) navigator.vibrate(20); paint(); };
$('rm').onclick = () => { if (roundCount > 0) roundCount--; paint(); };
$('xp').onclick = () => { reps++; if (navigator.vibrate) navigator.vibrate(10); paint(); };
$('xm').onclick = () => { if (reps > 0) reps--; paint(); };

renderSetup();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
