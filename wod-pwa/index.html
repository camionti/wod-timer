<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>WOD Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WOD Timer">
<meta name="theme-color" content="#f5f7fc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #cfe3ff; }
  @property --c2 { syntax: '<color>'; inherits: true; initial-value: #f5f7fc; }

  :root {
    --c1: #cfe3ff; --c2: #f5f7fc; --accent: #0a84ff;
    --glass: rgba(255,255,255,.75); --stroke: rgba(0,0,0,.07);
    --muted: rgba(28,28,30,.55);
  }
  body.countdown { --c1: #ffd9a3; --c2: #fff1dc; --accent: #ff9500; }
  body.work      { --c1: #b4f2c8; --c2: #e6fbee; --accent: #1fb455; }
  body.rest      { --c1: #ffc2bd; --c2: #ffeceb; --accent: #ff453a; }
  body.finished  { --c1: #bddaff; --c2: #e8f2ff; --accent: #0a84ff; }
  body.paused    { --c1: #e4e4ee; --c2: #f6f6fa; --accent: #ff9500; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; color: #1c1c1e; overscroll-behavior: none;
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  body {
    background:
      radial-gradient(120% 70% at 50% -10%, var(--c1) 0%, transparent 60%),
      linear-gradient(180deg, var(--c2), #f7f8fc 85%);
    background-attachment: fixed;
    transition: --c1 .6s ease, --c2 .6s ease;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .screen { display: none; min-height: 100dvh; flex-direction: column; padding: 14px 0 20px; }
  .screen.on { display: flex; animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .spacer { flex: 1; }

  /* ---------- Setup ---------- */
  .brand { display: flex; align-items: center; gap: 10px; margin: 6px 0 22px; }
  .brand i { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #30d158, #0a84ff);
    display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 13px; color: #000; }
  .brand b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
    background: rgba(0,0,0,.06); border-radius: 16px; }
  .seg button { border: 0; background: none; padding: 11px 0; font-size: 14px; font-weight: 600;
    color: var(--muted); border-radius: 12px; transition: all .2s; }
  .seg button.sel { background: #fff; color: #1c1c1e; box-shadow: 0 2px 10px rgba(0,0,0,.12); }

  .hint { color: var(--muted); font-size: 14px; line-height: 1.4; margin: 16px 4px 18px; min-height: 40px; }

  .card { background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px; padding: 4px 18px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0;
    border-bottom: 1px solid rgba(0,0,0,.06); }
  .row:last-child { border: 0; }
  .row label { font-size: 16px; font-weight: 500; }
  .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .step { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,.05); border-radius: 14px; padding: 4px; }
  .step button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 22px; line-height: 1; transition: transform .1s; }
  .step button:active { transform: scale(.88); }
  .step span { min-width: 46px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  .go { position: relative; width: 100%; padding: 20px 0; border: 0; border-radius: 22px; font-size: 20px; font-weight: 800;
    letter-spacing: .08em; color: #fff; background: linear-gradient(135deg, #3ddc72, #1fb455);
    box-shadow: 0 10px 28px rgba(31,180,85,.35), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .12s; }
  .go:active { transform: scale(.97); }

  /* ---------- Reloj ---------- */
  .chip { align-self: center; margin-top: 8px; padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    letter-spacing: .12em; background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

  .dial { position: relative; width: min(86vw, 52vh, 380px); aspect-ratio: 1; align-self: center; margin: 18px 0; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .dial circle { fill: none; stroke-width: 5; stroke-linecap: round; }
  .dial .track { stroke: rgba(0,0,0,.07); }
  .dial .fill { stroke: var(--accent); stroke-dasharray: 289.03; stroke-dashoffset: 289.03;
    filter: drop-shadow(0 2px 6px var(--accent)); transition: stroke-dashoffset .12s linear; }
  .dial .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #time { font-size: min(21vw, 15vh, 104px); font-weight: 800; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums; line-height: 1; }
  #sub { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .06em; min-height: 20px; }
  .pulse #time { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.03); } }

  #rounds { display: none; align-items: center; justify-content: space-between; margin: 0 auto 8px; width: min(100%, 360px);
    padding: 10px 12px 10px 20px; background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  #rounds .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
  #rounds .n { font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #rounds .b { display: flex; gap: 8px; }
  #rounds button { width: 54px; height: 54px; border-radius: 17px; border: 0; background: rgba(0,0,0,.06);
    font-size: 28px; transition: transform .1s; }
  #rounds button:active { transform: scale(.9); }
  #rounds #rp { background: var(--accent); color: #fff; width: 80px; }

  .btns { display: flex; gap: 12px; }
  .big { flex: 1; padding: 19px 0; border: 0; border-radius: 20px; font-size: 16px; font-weight: 800; letter-spacing: .08em;
    color: #1c1c1e; background: #fff; transition: transform .12s; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .big:active { transform: scale(.96); }
  .big.y { background: #ffd60a; } .big.g { background: #30d158; } .big.r { background: #ff453a; color: #fff; }
  .big.ghost { background: var(--glass); color: #fff; border: 1px solid var(--stroke); box-shadow: none;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
</style>
</head>
<body>

<div class="screen on" id="setup">
  <div class="brand"><i>WOD</i><b>Timer</b></div>
  <div class="seg" id="modes"></div>
  <div class="hint" id="hint"></div>
  <div class="card" id="fields"></div>
  <div class="spacer"></div>
  <button class="go" id="start">START</button>
</div>

<div class="screen" id="run">
  <div class="chip" id="head"></div>
  <div class="spacer"></div>
  <div class="dial">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="46"/>
      <circle class="fill" id="bar" cx="50" cy="50" r="46"/>
    </svg>
    <div class="center"><div id="time">00:00</div><div id="sub"></div></div>
  </div>
  <div id="rounds">
    <div><div class="lbl">RONDAS</div><div class="n" id="rc">0</div></div>
    <div class="b"><button id="rm">−</button><button id="rp">+</button></div>
  </div>
  <div class="spacer"></div>
  <div class="btns" id="ctl"></div>
</div>

<script>
const MODES = {
  fortime: { name: 'For Time', hint: 'Cronómetro hacia arriba. Terminá cuando completes el WOD.' },
  amrap:   { name: 'AMRAP',    hint: 'Cuenta regresiva. Tantas rondas como puedas.' },
  emom:    { name: 'EMOM',     hint: 'Cada intervalo arranca una nueva ronda.' },
  tabata:  { name: 'Tabata',   hint: 'Intervalos de trabajo y descanso.' },
};
const FIELDS = {
  fortime: [['minutes', 'Time cap', 0, 120, 1, 'min · 0 = sin cap']],
  amrap:   [['minutes', 'Duración', 1, 120, 1, 'minutos']],
  emom:    [['interval', 'Intervalo', 10, 600, 5, 'segundos'], ['rounds', 'Rondas', 1, 100, 1, '']],
  tabata:  [['work', 'Trabajo', 5, 300, 5, 'segundos'], ['rest', 'Descanso', 0, 300, 5, 'segundos'], ['rounds', 'Rondas', 1, 50, 1, '']],
};
const PRE = ['pre', 'Cuenta previa', 0, 30, 1, 'segundos'];
const cfg = Object.assign({ mode: 'amrap', minutes: 10, interval: 60, rounds: 10, work: 20, rest: 10, pre: 10 },
  JSON.parse(localStorage.getItem('wodcfg') || '{}'));

const $ = id => document.getElementById(id);
let state = 'idle', elapsed = 0, pre = 0, roundCount = 0, tm = null, last = 0, lastPhase = -1, lastSec = -1, wake = null;

// ---------- Setup ----------
function renderSetup() {
  $('modes').innerHTML = Object.entries(MODES).map(([k, m]) =>
    `<button data-m="${k}" class="${k === cfg.mode ? 'sel' : ''}">${m.name}</button>`).join('');
  $('hint').textContent = MODES[cfg.mode].hint;
  $('fields').innerHTML = [...FIELDS[cfg.mode], PRE].map(([k, label, , , , note]) =>
    `<div class="row"><label>${label}${note ? `<small>${note}</small>` : ''}</label><div class="step">
      <button data-k="${k}" data-d="-1">−</button><span>${cfg[k]}</span><button data-k="${k}" data-d="1">+</button></div></div>`).join('');
}
$('modes').onclick = e => { const m = e.target.dataset.m; if (m) { cfg.mode = m; save(); renderSetup(); } };
$('fields').onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  const def = [...FIELDS[cfg.mode], PRE].find(f => f[0] === k);
  cfg[k] = Math.min(def[3], Math.max(def[2], cfg[k] + def[4] * Number(e.target.dataset.d)));
  save(); renderSetup();
};
const save = () => localStorage.setItem('wodcfg', JSON.stringify(cfg));

// ---------- Derivados ----------
function total() {
  switch (cfg.mode) {
    case 'fortime': return cfg.minutes > 0 ? cfg.minutes * 60 : null;
    case 'amrap': return cfg.minutes * 60;
    case 'emom': return cfg.interval * cfg.rounds;
    case 'tabata': return (cfg.work + cfg.rest) * cfg.rounds;
  }
}
function cycle() { return cfg.mode === 'emom' ? cfg.interval : cfg.work + cfg.rest; }
function round() { return Math.min(Math.floor(elapsed / cycle()) + 1, cfg.rounds); }
function phase() {
  if (cfg.mode !== 'tabata') return 'work';
  return elapsed % cycle() < cfg.work ? 'work' : 'rest';
}
function display() {
  if (state === 'countdown') return Math.max(pre, 0);
  switch (cfg.mode) {
    case 'fortime': return elapsed;
    case 'amrap': return Math.max(total() - elapsed, 0);
    case 'emom': return cfg.interval - (elapsed % cfg.interval);
    case 'tabata': { const c = elapsed % cycle(); return c < cfg.work ? cfg.work - c : cycle() - c; }
  }
}

// ---------- Sonido ----------
let ac;
function tone(freq, dur) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.type = 'square';
    g.gain.setValueAtTime(.25, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(dur * 500);
}
const beepShort = () => tone(880, .12);
const beepLong = () => tone(1320, .6);

// ---------- Control ----------
async function lock(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (wake) { wake.release(); wake = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (state === 'running' || state === 'countdown')) lock(true);
});

function begin() {
  elapsed = 0; roundCount = 0; lastPhase = -1; lastSec = -1;
  tone(1, .01); // desbloquea el audio en iOS
  lock(true);
  if (cfg.pre > 0) { pre = cfg.pre; state = 'countdown'; } else { state = 'running'; beepLong(); }
  ticking(); show();
}
function ticking() { clearInterval(tm); last = performance.now(); tm = setInterval(tick, 50); }
function tick() {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  if (state === 'countdown') {
    pre -= dt;
    const s = Math.ceil(pre);
    if (s !== lastSec) { lastSec = s; if (s > 0 && s <= 3) beepShort(); }
    if (pre <= 0) { state = 'running'; lastSec = -1; beepLong(); }
  } else if (state === 'running') {
    elapsed += dt;
    const t = total();
    if (t !== null && elapsed >= t) { elapsed = t; return finish(); }
    if (cfg.mode !== 'fortime') {
      const id = cfg.mode === 'emom' ? round() : round() * 2 + (phase() === 'work' ? 0 : 1);
      if (lastPhase !== -1 && id !== lastPhase) beepLong();
      lastPhase = id;
      const s = Math.ceil(display());
      if (s !== lastSec) { lastSec = s; if (s >= 1 && s <= 3) beepShort(); }
    }
  }
  paint();
}
function pause() { clearInterval(tm); if (state === 'countdown') { state = 'idle'; lock(false); } else state = 'paused'; show(); }
function resume() { state = 'running'; lock(true); ticking(); show(); }
function finish() { clearInterval(tm); state = 'finished'; lock(false); beepLong(); show(); }
function reset() { clearInterval(tm); state = 'idle'; elapsed = 0; lock(false); show(); }

// ---------- Pantalla ----------
function btn(label, cls, fn) { return `<button class="big ${cls}" data-a="${fn}">${label}</button>`; }
function show() {
  $('setup').classList.toggle('on', state === 'idle');
  $('run').classList.toggle('on', state !== 'idle');
  $('ctl').innerHTML =
    state === 'countdown' ? btn('PAUSA', 'y', 'pause') :
    state === 'running' ? btn('PAUSA', 'y', 'pause') + (cfg.mode === 'fortime' ? btn('TERMINAR', '', 'finish') : '') :
    state === 'paused' ? btn('SEGUIR', 'g', 'resume') + btn('RESET', 'r', 'reset') :
    state === 'finished' ? btn('NUEVO WOD', '', 'reset') : '';
  $('rounds').style.display = cfg.mode === 'amrap' && state !== 'countdown' ? 'flex' : 'none';
  paint();
}
const C = 2 * Math.PI * 46;
function paint() {
  if (state === 'idle') { document.body.className = ''; return; }
  const up = cfg.mode === 'fortime' && state !== 'countdown';
  const v = up ? Math.floor(display()) : Math.ceil(display());
  $('time').textContent = String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
  $('rc').textContent = roundCount;

  // anillo: avance del WOD; en For Time sin cap marca cada minuto
  const t = total();
  let p = 0;
  if (state === 'countdown') p = 1 - Math.max(pre, 0) / Math.max(cfg.pre, 1);
  else if (t) p = Math.min(elapsed / t, 1);
  else p = (elapsed % 60) / 60;
  $('bar').style.strokeDashoffset = C * (1 - p);

  let head, sub = '';
  if (state === 'countdown') head = 'PREPARATE';
  else if (state === 'finished') { head = '¡TERMINADO!'; sub = cfg.mode === 'fortime' ? 'TIEMPO FINAL' : ''; }
  else if (state === 'paused') head = 'PAUSA';
  else if (cfg.mode === 'emom') { head = 'EMOM'; sub = `RONDA ${round()} / ${cfg.rounds}`; }
  else if (cfg.mode === 'tabata') { head = phase() === 'work' ? 'TRABAJO' : 'DESCANSO'; sub = `RONDA ${round()} / ${cfg.rounds}`; }
  else head = MODES[cfg.mode].name.toUpperCase();
  $('head').textContent = head;
  $('sub').textContent = sub;

  document.body.className = state === 'countdown' ? 'countdown pulse' : state === 'finished' ? 'finished' :
    state === 'paused' ? 'paused' : phase();
  $('run').classList.toggle('pulse', state === 'countdown');
}

$('start').onclick = begin;
$('ctl').onclick = e => { const a = e.target.dataset.a; if (a) ({ pause, resume, finish, reset })[a](); };
$('rp').onclick = () => { roundCount++; if (navigator.vibrate) navigator.vibrate(20); paint(); };
$('rm').onclick = () => { if (roundCount > 0) roundCount--; paint(); };

renderSetup();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
